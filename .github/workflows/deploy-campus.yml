name: Deploy SOMA Campus

on:
  push:
    branches: [claude/elegant-feistel-76b80d]
    paths:
      - 'office/**'
      - '.github/workflows/deploy-campus.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --dir dist --functions netlify/functions --message "CI: ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
