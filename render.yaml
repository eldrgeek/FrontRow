services:
  # Production Backend (master branch)
  - type: web
    name: frontrow-tvu6  # Match existing deployment
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    branch: master
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render uses 10000, not 3001

  # Staging Backend (develop branch)  
  - type: web
    name: frontrow-staging
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    branch: develop
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3001