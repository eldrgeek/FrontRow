[build]
  publish = "front-row-vite/dist"
  command = "cd netlify/functions && npm install && cd ../../front-row-vite && npm install && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stale build-request escalation (SOMA-APP-STANDARD.md §15a) — re-notifies Rigg
# about a build request nobody's picked up, without depending on an admin having
# the Feedback Queue page open. Runs every 30 minutes; the function itself
# re-escalates a given request at most once per 2h window.
[functions."check-stale-build-requests"]
  schedule = "*/30 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SOMA feedback stack — route /api/* to the Netlify Functions. MUST come before
# the SPA catch-all below, or the /* rule would swallow these paths.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  VITE_BACKEND_URL = "https://vpsmikewolf.duckdns.org:4001"
  VITE_SOCKET_URL = "https://vpsmikewolf.duckdns.org:4001"
  VITE_LIVEKIT_URL = "wss://hootnet-zkp2l3aj.livekit.cloud"
  VITE_ENABLE_TEST_MODE = "true"

[context.deploy-preview.environment]
  NODE_ENV = "preview"
  VITE_BACKEND_URL = "https://vpsmikewolf.duckdns.org:4001"
  VITE_SOCKET_URL = "https://vpsmikewolf.duckdns.org:4001"
  VITE_LIVEKIT_URL = "wss://hootnet-zkp2l3aj.livekit.cloud"
