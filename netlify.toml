[build]
  publish = "front-row-vite/dist"
  command = "cd netlify/functions && npm install && cd ../../front-row-vite && npm install && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  VITE_BACKEND_URL = "https://frontrow-tvu6.onrender.com"
  VITE_SOCKET_URL = "https://frontrow-tvu6.onrender.com"
  VITE_LIVEKIT_URL = "wss://vpsmikewolf.duckdns.org"
  VITE_ENABLE_TEST_MODE = "true"

[context.deploy-preview.environment]
  NODE_ENV = "preview"
  VITE_BACKEND_URL = "https://frontrow-tvu6.onrender.com"
  VITE_SOCKET_URL = "https://frontrow-tvu6.onrender.com"
  VITE_LIVEKIT_URL = "wss://vpsmikewolf.duckdns.org"
  VITE_ENABLE_TEST_MODE = "true"
